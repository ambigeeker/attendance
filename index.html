<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workplace Attendance Log</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Workplace Attendance Log 📋</h2>

        <form id="attendance_form">
            <div class="form-group">
                <label for="employee_name">Full Name 👤</label>
                <input type="text" id="employee_name" name="employee_name" placeholder="e.g. Engr. Mustapha" required>
            </div>

            <div class="form-group">
                <label for="designation">Designation 💼</label>
                <input type="text" id="designation" name="designation" placeholder="e.g. Senior Engineer" required>
            </div>

            <div class="form-group">
                <label for="department">Department 🏢</label>
                <input type="text" id="department" name="department" placeholder="e.g. Fish Technology" required>
            </div>

            <div class="form-group">
                <label for="section">Section 📂</label>
                <input type="text" id="section" name="section" placeholder="e.g. Fish Food Engineering" required>
            </div>

            <div class="form-group">
                <label for="action_type">Action Type 🔄</label>
                <select id="action_type" name="action_type" required>
                    <option value="Check-In">Check-In</option>
                    <option value="Check-Out">Check-Out</option>
                </select>
            </div>

            <button type="submit">Submit Attendance</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
